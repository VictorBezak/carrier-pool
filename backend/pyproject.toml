[project]
name = "carrier-pool-backend"
version = "0.1.0"
description = "Carrier recommendation engine for freight broker TMS data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
carrier-pool = "carrier_pool.cli:main"
carrier-pool-sync = "carrier_pool.sync:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
carrier_pool = ["schema.sql", "reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." exposes the repo-root tools/ package so tests can assert the generator and the
# ranker resolve coordinates from the same vendored reference.
pythonpath = ["src", ".."]
