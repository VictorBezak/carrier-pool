[project]
name = "carrier-pool-backend"
version = "0.1.0"
description = "Carrier recommendation engine for freight broker TMS data"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." exposes the repo-root tools/ package so tests can assert the generator and the
# ranker resolve coordinates from the same vendored reference.
pythonpath = ["src", ".."]
