server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The app calls a relative /api, so the same code works in dev (Vite proxy)
  # and here.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routing: unknown paths are React routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
